name: Record license request

# The kit opens a GitHub issue titled "License REQUEST <PCCODE>" via the
# GitHub API. This workflow parses it into pending.txt. If the PC code is
# ALREADY in approved.txt (re-activation with a new identity on the same
# approved machine), it also triggers the grant workflow immediately -
# no author action needed for reinstalls.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse issue and register public key
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/record_request.py
      - name: Re-grant if this PC is already approved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PC=$(python scripts/pc_from_event.py)
          if [ -n "$PC" ] && grep -qiw "$PC" approved.txt; then
            echo "$PC already approved - triggering grant workflow"
            gh workflow run grant.yml --repo "$GITHUB_REPOSITORY"
          fi
      - name: Close issue with note
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PC=$(python scripts/pc_from_event.py)
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Request registered for $PC." || true
