name: Record license request

# The kit opens a GitHub issue titled "License REQUEST <PCCODE>" via the
# GitHub API. This workflow parses it into pending.txt. Granting keys is
# ALWAYS a separate author action (add the code to approved.txt, or run
# grant.yml from the Actions tab) - never automatic, so nobody can pull a
# grant for an approved PC code by filing an issue with their own key.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse issue and register public key
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/record_request.py
      - name: Close issue with note
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PC=$(python scripts/pc_from_event.py)
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "License request received for $PC. The author will review and grant." || true
